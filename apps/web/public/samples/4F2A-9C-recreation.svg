<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640" role="img" aria-label="The same layout rebuilt from measurements: the same gradient band, the same headline block, and the same three-card row, with small differences in the copy blocks.">
  <title>Recreation generated by Slop Scorer from the measurements in the receipt</title>
  <!--
    The recreation. Built from the measured values the receipt cites, not by copying the file
    beside it: same gradient stops, same headline mass, same three-card row at the same radius
    and the same two-layer shadow.

    It is deliberately not pixel-identical. The line lengths in the card bodies differ, which
    is what a rebuild from measurements actually produces. A recreation that matched byte for
    byte would be a copy, and would be making a claim about the original we are not making.
  -->
  <defs>
    <linearGradient id="r-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="r-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.05"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1024" height="640" fill="#FFFFFF"/>
  <rect width="1024" height="300" fill="url(#r-hero)"/>

  <rect x="64" y="36" width="88" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="788" y="34" width="48" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="852" y="34" width="56" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="924" y="30" width="36" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.9"/>

  <rect x="456" y="96" width="112" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.28"/>
  <rect x="152" y="144" width="720" height="40" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="248" y="196" width="528" height="40" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="344" y="256" width="336" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.7"/>

  <g filter="url(#r-card)">
    <rect x="64" y="368" width="288" height="200" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="368" y="368" width="288" height="200" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="672" y="368" width="288" height="200" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>

  <g fill="#E5E7EB">
    <rect x="96" y="400" width="32" height="32" rx="8"/>
    <rect x="400" y="400" width="32" height="32" rx="8"/>
    <rect x="704" y="400" width="32" height="32" rx="8"/>
  </g>
  <g fill="#111827" fill-opacity="0.85">
    <rect x="96" y="452" width="148" height="14" rx="4"/>
    <rect x="400" y="452" width="172" height="14" rx="4"/>
    <rect x="704" y="452" width="156" height="14" rx="4"/>
  </g>
  <g fill="#9CA3AF">
    <rect x="96" y="482" width="216" height="10" rx="5"/>
    <rect x="96" y="502" width="176" height="10" rx="5"/>
    <rect x="400" y="482" width="228" height="10" rx="5"/>
    <rect x="400" y="502" width="200" height="10" rx="5"/>
    <rect x="704" y="482" width="208" height="10" rx="5"/>
    <rect x="704" y="502" width="184" height="10" rx="5"/>
  </g>

  <rect x="64" y="600" width="896" height="1" fill="#E5E7EB"/>
</svg>
