<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640" role="img" aria-label="A generated-looking marketing page: a violet to blue gradient band, one very large bold headline, and a row of three identical bordered cards.">
  <title>Fixture: a template-shaped marketing page, generated by us for this sample</title>
  <!--
    This file is a fixture WE MADE for the sample receipt. It is not a screenshot of anybody
    else's site. We never put a recreation of somebody else's work in our own marketing, and
    a sample receipt is marketing.

    It is drawn to carry, literally, the tells the sample receipt cites: the violet-to-blue
    gradient (css.violet-blue-gradient), the oversized heavy headline with crushed tracking
    (css.crushed-tracking), and three identical cards with a 16px radius and a two-layer
    shadow (dom.uniform-cards).
  -->
  <defs>
    <linearGradient id="s-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="s-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.05"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1024" height="640" fill="#FFFFFF"/>
  <rect width="1024" height="300" fill="url(#s-hero)"/>

  <rect x="64" y="36" width="96" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="784" y="34" width="52" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="852" y="34" width="52" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="920" y="30" width="40" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.9"/>

  <rect x="452" y="96" width="120" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.28"/>
  <rect x="152" y="144" width="720" height="40" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="232" y="196" width="560" height="40" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="332" y="256" width="360" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.7"/>

  <g filter="url(#s-card)">
    <rect x="64" y="368" width="288" height="200" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="368" y="368" width="288" height="200" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="672" y="368" width="288" height="200" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  </g>

  <g fill="#E5E7EB">
    <rect x="96" y="400" width="32" height="32" rx="8"/>
    <rect x="400" y="400" width="32" height="32" rx="8"/>
    <rect x="704" y="400" width="32" height="32" rx="8"/>
  </g>
  <g fill="#111827" fill-opacity="0.85">
    <rect x="96" y="452" width="160" height="14" rx="4"/>
    <rect x="400" y="452" width="160" height="14" rx="4"/>
    <rect x="704" y="452" width="160" height="14" rx="4"/>
  </g>
  <g fill="#9CA3AF">
    <rect x="96" y="482" width="224" height="10" rx="5"/>
    <rect x="96" y="502" width="192" height="10" rx="5"/>
    <rect x="400" y="482" width="224" height="10" rx="5"/>
    <rect x="400" y="502" width="192" height="10" rx="5"/>
    <rect x="704" y="482" width="224" height="10" rx="5"/>
    <rect x="704" y="502" width="192" height="10" rx="5"/>
  </g>

  <rect x="64" y="600" width="896" height="1" fill="#E5E7EB"/>
</svg>
